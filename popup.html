<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Chess Review</title>
  <style>
    :root {
      color-scheme:dark;
      --font-ui:"Hanken Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      --bg:#191917;--panel:#211f1a;--panel-2:#282620;--line:#39362f;
      --ink:#f3f1ea;--ink-2:#b8b4a8;--ink-3:#969183;--accent:#7fb45f;
    }
    *{box-sizing:border-box} [hidden]{display:none!important}
    html,body{margin:0;scrollbar-width:none}
    html::-webkit-scrollbar,body::-webkit-scrollbar{display:none}
    body{width:360px;max-width:100%;padding:18px;background:radial-gradient(110% 80% at 0 0,#282a21,var(--bg) 75%);color:var(--ink);font:13px/1.45 var(--font-ui);-webkit-font-smoothing:antialiased}
    button,input,textarea{font:inherit} button{cursor:pointer;color:inherit}
    button:disabled{opacity:.5;cursor:default}
    button:focus-visible,summary:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
    .brand{display:flex;align-items:center;gap:10px}
    .brand-mark{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--accent);box-shadow:inset 0 1px 0 #ffffff30}
    .brand-img{width:23px;height:23px}
    .brand-name{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.brand-name span{color:var(--ink-3);font-weight:600}
    .intro{margin:13px 0 10px;color:var(--ink-2);font-size:14px}
    .popup-actions{position:relative;isolation:isolate;display:grid;gap:5px;padding:5px;border:1px solid var(--line);border-radius:15px;background:var(--panel)}
    .action-button{position:relative;z-index:1;display:flex;align-items:center;gap:13px;width:100%;min-height:64px;padding:11px 13px;border:0;border-radius:10px;background:transparent;text-align:left;transition:color .2s}
    .action-button svg{width:23px;height:23px;flex:none;color:var(--accent)}
    .action-copy{flex:1;min-width:0}.action-copy strong{display:block;font-size:14px;font-weight:700;line-height:1.3}.action-copy small{display:block;margin-top:4px;font-size:11px;color:var(--ink-2)}
    .action-arrow{font-size:18px;color:var(--ink-3)}
    .action-button[data-highlighted="true"] strong{color:var(--accent)}
    .fluid-indicator{position:absolute;z-index:0;pointer-events:none;visibility:hidden;border-radius:10px;
      background:radial-gradient(ellipse at 24% 0%,#ffffff0d,transparent 65%),linear-gradient(115deg,color-mix(in oklab,var(--accent) 22%,var(--panel)),color-mix(in oklab,var(--accent) 12%,var(--panel)));
      box-shadow:inset 0 1px 0 #ffffff12,inset 0 -1px 0 #00000014}
    .popup-actions[data-ready="true"] .fluid-indicator{visibility:visible}
    #status{margin:12px 3px 0;color:var(--ink-2);font-size:11.5px;line-height:1.55;white-space:pre-line;overflow-wrap:anywhere}#status:empty{display:none}#status.error{color:#f99188}
    details{margin-top:14px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
    summary{display:flex;align-items:center;gap:8px;list-style:none;cursor:pointer;padding:11px 13px;color:var(--ink-2);font-size:12px;font-weight:650;user-select:none}
    summary::-webkit-details-marker{display:none}summary:hover{color:var(--ink)}.chev{display:inline-flex;transition:transform .2s}.chev svg{width:13px;height:13px}details[open] .chev{transform:rotate(90deg)}details[open]{margin-top:10px}
    .manual-fields{padding:0 13px 10px}label{display:block;margin:12px 0 5px;font-size:11px;color:var(--ink-2)}.hint{display:inline;font-size:10px;color:var(--ink-3);margin-top:2px}
    input,textarea{min-width:0;width:100%;padding:9px 10px;color:var(--ink);background:var(--panel-2);border:1px solid var(--line);border-radius:8px;font-size:12px}
    input::placeholder,textarea::placeholder{color:var(--ink-3)}textarea{display:block;resize:vertical;min-height:84px;max-height:240px;line-height:1.5;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
    .row{display:flex;gap:7px}.row input{flex:1}
    .secondary,.ghost{padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2);font-size:12px;font-weight:650;transition:background .2s,border-color .2s}
    .secondary:hover,.ghost:hover{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--panel-2))}
    .ghost{width:100%;margin-top:9px}.secondary{color:var(--accent)}
    /* Leave room for the 240px input inside Chrome's 600px popup height limit. */
    body:has(#manual[open]){position:relative;padding:14px}
    body:has(#manual[open]) .intro{display:none}
    body:has(#manual[open]) .action-button{min-height:54px;padding:8px 13px}
    body:has(#manual[open]) #status{margin-top:8px}
    #manual[open]{margin-top:8px}
    #manual[open] summary{padding-block:9px}
    #manual[open] label{margin-top:8px}
    body:has(#manual[open]) #cancelImport{position:absolute;top:14px;right:14px;width:auto;margin:0;padding:5px 8px;font-size:11px}
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
  <header class="brand">
    <div class="brand-mark"><img class="brand-img" src="pieces-img/cburnett/wN.svg" alt=""></div>
    <div class="brand-name">Chess <span>/ Review</span></div>
  </header>
  <p class="intro">Choose your next move.</p>
  <main>
    <div class="popup-actions" aria-label="Chess Review actions">
      <span class="fluid-indicator" aria-hidden="true"></span>
      <button id="analyzeCurrent" class="action-button" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 20V10m5 10V4m5 16v-7m5 7V7" stroke-linecap="round"/></svg>
        <span class="action-copy"><strong>Analyze this game</strong><small>Active Chess.com or Lichess game</small></span><span class="action-arrow" aria-hidden="true">→</span>
      </button>
      <button id="openWorkspace" class="action-button" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 9h18M8 9v11"/></svg>
        <span class="action-copy"><strong>Open Chess Review</strong><small>Start without a game</small></span><span class="action-arrow" aria-hidden="true">→</span>
      </button>
    </div>
    <div id="status" role="status" aria-live="polite" aria-atomic="true"></div>
    <button id="cancelImport" class="ghost" type="button" hidden>Cancel import</button>
    <details id="manual">
      <summary><span class="chev" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></span>Manual setup <span aria-hidden="true">·</span> URL or PGN</summary>
      <div class="manual-fields">
        <label for="manualInput">Chess.com / Lichess URL or PGN</label>
        <textarea id="manualInput" placeholder="https://lichess.org/CZmytj0X&#10;or paste a PGN: 1. e4 e5 2. Nf3 …" spellcheck="false"></textarea>
        <button id="analyzeManual" class="ghost" type="button">Analyze pasted game</button>
      </div>
    </details>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
