name: Maintained source
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run verify:source
      - run: npm run verify:history
      - run: npm test
      - run: npm run test:research
      - run: npm run research:preflight -- D001 --purpose inspect
      - run: node tools/calibration/reproduce-public.mjs
