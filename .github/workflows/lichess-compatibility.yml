name: Lichess compatibility
on:
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * *'
  pull_request:
    paths:
      - 'lichess*.js'
      - 'analyze-flow.js'
      - 'browser-compat.js'
      - 'gamecache.js'
      - 'lib/import-request.js'
      - 'manifest.json'
      - 'package*.json'
      - 'scripts/lichess-smoke.mjs'
      - '.github/workflows/lichess-compatibility.yml'
permissions:
  contents: read
jobs:
  live-import:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:lichess-live
        env:
          CHROME_PATH: google-chrome
