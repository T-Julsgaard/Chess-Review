version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Copenhagen
    open-pull-requests-limit: 5
    groups:
      # Security fixes are raised as available, independently of the weekly schedule.
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
      # Major version upgrades remain separate pull requests for individual review.
      npm-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
